<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<title>ステーションの地図</title>
<!-- ステーションの階層マップ (StationMapWeb で開く。データはアプリから PostWebMessageAsJson で受け取る。SVG と素の JS。外部のライブラリは使わない) -->
<link rel="stylesheet" href="viewer.css">
</head>
<body>
<svg id="map" xmlns="http://www.w3.org/2000/svg">
  <g id="world"></g>
  <g id="overlay"></g>
</svg>
<div id="hint">左クリック: 区画を選ぶ / 左ボタンの長押し: ピンを立てる (押したまま動かすと地図を動かす) / 右クリック: 押した所を中心に拡大 / ホイール: 拡大・縮小</div>
<div id="msg"></div>
<!-- 左上のボタン (viewer.js の updateBack): 全体図 (地区のある都市では「← 全体図へ戻る」)・地区の全体（真上）・上の階・下の階。全体図のシャトルの向きの凡例 -->
<div id="tools">
  <button id="back" type="button">全体図</button>
  <button id="plan" type="button">地区の全体（真上）</button>
  <button id="floorUp" type="button">▲ 上の階</button>
  <button id="floorDown" type="button">▼ 下の階</button>
</div>
<div id="legend"></div>
<script src="viewer.js"></script>
</body>
</html>
