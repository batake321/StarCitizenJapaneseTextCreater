<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<title>3D 表示</title>
<!-- 船の 3D 表示 (Ship3DWeb が WebView2 で開く)。
     three.js 0.186.1 (同梱。wwwroot\three) で、StarBreaker が書き出した GLB (キャッシュのフォルダ) を出す。
     開き方: https://scjt-viewer.example/ship3d/viewer.html?glb=<GLB の URL>&title=<船の名前>
       &item=1: 船でない品 (武器・装備など)。［船外］［船内］のボタンと「船内の位置」の欄を出さない (2026-11-05、利用者の指示「船内船外はおかしい」)
       &thumb=1: 小さな絵 (［詳細］の見出しの右。DetailPanel.RenderThumbAsync)。画面の部品を出さず、192×192 の透明な背景で船外の初めの向きから 1 コマ描き、
         chrome.webview.postMessage({type:'thumb', png:<PNG の data URL>}) で返す
       &table=<材質の表の URL> (小さな絵のときだけ): その表を当ててから描く (色付けなし・古い版の GLB の標準の表)
       &ship=<短い名前>: 塗装の切り替えと色付けの設定 (2026-11-05)。小さな絵のときは使わない。アプリとのやり取り (Ship3DWeb):
         ビューア → アプリ {type:'paintInit', ship} (開いたとき)
           ← {type:'paintList', ship, items:[{id, en, ja}], initial, standardId}: items が空でなければ右端に塗装の一覧を出す (id '' は「標準」)。
             standardId: 「標準」に当てる材質の表 ('' なら GLB の材質のまま、'~std' なら GLB が古い版の材質の決め方なので今のコードの標準の表を当てる)。
             initial が '' でなければ、その塗装 (保存した塗装・色付けを切ったときの '~nopal') を初めに当てる
         ビューア → アプリ {type:'paintTable', ship, id} (塗装を選んだとき。初めての塗装は作るのに数秒かかる)
           ← {type:'paintTable', ship, id, url} (材質の表の JSON の URL) か {type:'paintTable', ship, id, error}
         材質の表: {materials: glTF の材質の配列, prims: mesh ごとの primitive ごとの材質の番号}。形・画像は読み込んだ GLB のまま、材質だけを差し替える
     GLB の座標 (実物で確かめたもの。t_ORIG_600i.glb / t_ORIG_X1.glb): いちばん上のノード CryEngine_Z_up が Z 上向きを Y 上向きに直していて、
       上 = +Y、前 = -Z (600i の hardpoint_seat_pilot が z = -45 で船の範囲 -66.7〜60.2 の前寄り。操縦席のノードの +Y 軸 (CryEngine の前) も -Z を向く)、
       左 = -X (hardpoint_seat_bridge_left が x = -1.41、_right が +1.41)。 -->
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; background: #1b1e24; color: #eee; font-family: "Yu Gothic UI", "Meiryo", sans-serif; font-size: 13px; }
  #wrap { position: absolute; inset: 0; display: flex; }
  #view { position: relative; flex: 1; min-width: 0; }
  canvas { display: block; width: 100%; height: 100%; outline: none; }
  #side { width: 170px; background: #262a33; border-left: 1px solid #3a3f4a; overflow-y: auto; padding: 6px; box-sizing: border-box; }
  #side h3 { margin: 4px 0 6px; font-size: 13px; font-weight: bold; color: #ccc; }
  #side button { display: block; width: 100%; margin: 0 0 4px; text-align: left; }
  #side .none { color: #999; font-size: 12px; }
  #side .children { padding-left: 12px; }
  button { background: #3a404c; color: #eee; border: 1px solid #555c6a; border-radius: 3px; padding: 4px 8px; font: inherit; cursor: pointer; }
  button:hover { background: #4a5262; }
  button.on { background: #3d6db5; border-color: #5a8ad6; }
  #top { position: absolute; left: 8px; top: 8px; display: flex; gap: 6px; align-items: center; }
  #title { margin-left: 8px; font-weight: bold; text-shadow: 0 0 3px #000; }
  #help { position: absolute; left: 8px; bottom: 8px; color: #bbb; font-size: 12px; text-shadow: 0 0 3px #000; line-height: 1.5; pointer-events: none; }
  #msg { position: absolute; left: 50%; top: 50%; transform: translate(-50%, -50%); background: rgba(0,0,0,0.7); padding: 12px 18px; border-radius: 6px; max-width: 80%; white-space: pre-wrap; }
  #msg.hidden { display: none; }
  #msg.error { color: #ff9a9a; }
  .hidden { display: none !important; }
  /* 右上の閉じる (2026-11-05、利用者「閉じるボタンが欲しい右上の赤い x で」): 押すとアプリに {type:'close'} を送る (詳細の欄は［表に戻る］と同じ、別ウィンドウは閉じる) */
  #btnClose { position: absolute; right: 8px; top: 8px; width: 28px; height: 28px; padding: 0; line-height: 26px; text-align: center; font-size: 16px; font-weight: bold; color: #fff; background: #c62828; border: 1px solid #e57373; border-radius: 4px; }
  #btnClose:hover { background: #e53935; }
  /* 右端の塗装の一覧 (2026-11-05、利用者の指示「右端に縦のリストでバリエーションを表示して切替で見れるようにしたい」)。
     「船内の位置」の欄 (#side) の右に並べる。数が多い船 (最多 26 個) は欄の中でスクロールする。塗装の無い船・武器・装備・小さな絵では出さない */
  #paintSide { width: 170px; background: #262a33; border-left: 1px solid #3a3f4a; overflow-y: auto; padding: 6px; box-sizing: border-box; }
  #paintSide h3 { margin: 4px 0 6px; font-size: 13px; font-weight: bold; color: #ccc; }
  #paintSide button { display: block; width: 100%; margin: 0 0 4px; text-align: left; }
  #paintSide button .ja { display: block; font-size: 11px; color: #b8bfcc; }
  #paintSide button.on .ja { color: #e4ecfa; }
  /* 出せない塗装 (形の照合で断られた塗装。押せない。理由は説明 (title) に出す) */
  #paintSide button.ng, #paintSide button.ng:hover { background: #2e323b; color: #7d8390; border-color: #444a56; cursor: default; }
  #paintSide button.ng .ja { color: #6c7280; }
  /* 塗装を作っている間・切り替えられなかったときの知らせ (右下の小さな形。ステーションの 3D の取り出し中の形に合わせる) */
  #paintBusy { position: absolute; right: 12px; bottom: 12px; background: rgba(0,0,0,0.8); border: 1px solid #888; padding: 6px 10px; pointer-events: none; z-index: 5; max-width: 60%; }
  #paintBusyText { font-size: 13px; font-weight: bold; color: #fff; text-align: center; margin-bottom: 4px; white-space: pre-wrap; }
  #paintBusy.error #paintBusyText { color: #ff9a9a; margin-bottom: 0; }
  #paintBusyOuter { width: 200px; height: 8px; background: #333; border: 1px solid #777; overflow: hidden; position: relative; }
  #paintBusy.error #paintBusyOuter { display: none; }
  #paintBusyBar { position: absolute; top: 0; bottom: 0; width: 30%; background: #4a8; animation: paintbusy 1.2s linear infinite; }
  @keyframes paintbusy { from { left: -30%; } to { left: 100%; } }
</style>
<script type="importmap">
{ "imports": { "three": "../three/build/three.module.js" } }
</script>
</head>
<body>
<div id="wrap">
  <div id="view">
    <canvas id="canvas" tabindex="0"></canvas>
    <div id="top">
      <button id="btnOutside" class="on" title="船の外から見ます (Home で初めの位置)">船外</button>
      <button id="btnInside" title="船の中を見ます (Home で操縦席)">船内</button>
      <span id="title"></span>
    </div>
    <button id="btnClose" title="閉じる">✕</button>
    <div id="help">左ドラッグ: 回転 (船外は船のまわり / 船内は見回す)　右ドラッグ: 平行移動　ホイール: 拡大縮小 (船内は前後)<br>
      W/A/S/D: 前後左右　↑/↓: 上下　Insert/Delete: 拡大/縮小　Home: 初めの位置</div>
    <div id="msg">読み込みを始めています...</div>
    <div id="paintBusy" class="hidden"><div id="paintBusyText"></div><div id="paintBusyOuter"><div id="paintBusyBar"></div></div></div>
  </div>
  <div id="side">
    <h3>船内の位置</h3>
    <div id="places"><div class="none">(読み込み中)</div></div>
  </div>
  <div id="paintSide" class="hidden">
    <h3>塗装</h3>
    <div id="paints"></div>
  </div>
</div>
<script type="module">
import * as THREE from 'three';
import { GLTFLoader } from '../three/examples/jsm/loaders/GLTFLoader.js';

const params = new URLSearchParams(location.search);
const glbUrl = params.get('glb') || '';
// 右上の閉じる。小さな絵を描くとき (thumb) は出さない
{
  const bc = document.getElementById('btnClose');
  if (params.get('thumb') === '1') bc.classList.add('hidden');
  bc.addEventListener('click', () => { try { window.chrome?.webview?.postMessage({ type: 'close' }); } catch { } });
}
const title = params.get('title') || '';
document.getElementById('title').textContent = title;
document.title = title ? `3D 表示 - ${title}` : '3D 表示';
// 船でない品 (?item=1): ［船外］［船内］と「船内の位置」の欄は出さない。小さな絵 (?thumb=1): 画面の部品を全部出さない
const isItem = params.get('item') === '1';
const isThumb = params.get('thumb') === '1';
const THUMB_SIZE = 192;
if (isItem) for (const id of ['btnOutside', 'btnInside', 'side']) document.getElementById(id).classList.add('hidden');
if (isThumb) for (const id of ['top', 'help', 'side', 'msg']) document.getElementById(id).classList.add('hidden');
// 塗装の切り替え・色付けの設定 (小さな絵では使わない)
const shipName = params.get('ship') || '';
const paintIO = !isThumb && shipName.length > 0;

const msgEl = document.getElementById('msg');
function showMessage(text, isError) {
  if (isThumb) return;
  msgEl.textContent = text;
  msgEl.classList.toggle('hidden', !text);
  msgEl.classList.toggle('error', !!isError);
}
// 失敗はアプリにも知らせる (アプリのログに残す。Ship3DWeb の WebMessageReceived)
function reportError(text) {
  showMessage(text, true);
  try { window.chrome?.webview?.postMessage({ type: 'error', message: text }); } catch { }
}
window.addEventListener('error', e => reportError(`表示でエラーが起きました: ${e.message}`));
window.addEventListener('unhandledrejection', e => reportError(`表示でエラーが起きました: ${e.reason?.message ?? e.reason}`));

// ===== 船の向き (GLB を調べて決めたもの。ファイルの頭の説明) =====
const SHIP_FORWARD = new THREE.Vector3(0, 0, -1);
const SHIP_UP = new THREE.Vector3(0, 1, 0);
const SHIP_LEFT = new THREE.Vector3(-1, 0, 0);

// 目の高さ (位置のノードから上げる量。m)。座る所 (操縦席・タレット) は座った目の高さ、立つ所 (エレベーター・貨物室) は立った目の高さ
const EYE_SEATED = 1.2;
const EYE_STANDING = 1.7;
// 船内の移動の速さ (m/秒)
const INSIDE_SPEED = 3;

// ===== 描画の準備 =====
const canvas = document.getElementById('canvas');
let renderer;
try {
  // 船の外 (数百 m) から船内 (数 cm) まで出すので、深度は対数にする
  // 小さな絵は背景を透明にする (詳細のページの白い背景に置く)
  renderer = new THREE.WebGLRenderer({ canvas, antialias: true, logarithmicDepthBuffer: true, alpha: isThumb });
} catch (e) {
  reportError(`3D の描画 (WebGL) を使えません: ${e.message}`);
  throw e;
}
renderer.setPixelRatio(isThumb ? 1 : (window.devicePixelRatio || 1));
if (isThumb) renderer.setClearColor(0x000000, 0);
const scene = new THREE.Scene();
scene.background = isThumb ? null : new THREE.Color(0x1b1e24);
const camera = new THREE.PerspectiveCamera(50, 1, 0.05, 10000);
scene.add(camera);

// GLB に入っているライト (KHR_lights_punctual) は数が多すぎて重いので使わず、環境光 + 平行光、船内ではカメラに付けた光を使う
const ambient = new THREE.AmbientLight(0xffffff, 0.9);
scene.add(ambient);
const sun = new THREE.DirectionalLight(0xffffff, 2.2);
scene.add(sun);
scene.add(sun.target);
const camLight = new THREE.PointLight(0xffffff, 25, 0, 2);
camLight.visible = false;
camera.add(camLight);

function resize() {
  // 小さな絵は決まった大きさ (隠した WebView2 で開くので、枠の大きさには頼らない)
  if (isThumb) {
    renderer.setSize(THUMB_SIZE, THUMB_SIZE, false);
    camera.aspect = 1;
    camera.updateProjectionMatrix();
    return;
  }
  const view = document.getElementById('view');
  const w = Math.max(1, view.clientWidth), h = Math.max(1, view.clientHeight);
  renderer.setSize(w, h, false);
  camera.aspect = w / h;
  camera.updateProjectionMatrix();
}
window.addEventListener('resize', resize);
resize();

// ===== 見る位置 =====
// 船外: target のまわりを回る (radius・theta・phi)。船内: pos から yaw・pitch の向きを見る
const outside = { target: new THREE.Vector3(), radius: 10, theta: 0, phi: 1, home: null };
const inside = { pos: new THREE.Vector3(), yaw: 0, pitch: 0, fov: 70, home: null };
let mode = 'outside';
let shipRadius = 10;
let model = null;

function applyCamera() {
  if (mode === 'outside') {
    const off = new THREE.Vector3().setFromSphericalCoords(outside.radius, outside.phi, outside.theta);
    camera.position.copy(outside.target).add(off);
    camera.up.set(0, 1, 0);
    camera.lookAt(outside.target);
    camera.fov = 50;
  } else {
    camera.position.copy(inside.pos);
    camera.rotation.set(inside.pitch, inside.yaw, 0, 'YXZ');
    camera.fov = inside.fov;
  }
  camera.near = 0.05;
  camera.far = Math.max(5000, shipRadius * 50);
  camera.updateProjectionMatrix();
}

function setMode(m) {
  mode = m;
  document.getElementById('btnOutside').classList.toggle('on', m === 'outside');
  document.getElementById('btnInside').classList.toggle('on', m === 'inside');
  camLight.visible = m === 'inside';
  applyCamera();
}

// 船外の初めの位置: 左斜め前方の上から船を見下ろす。船全体 (外接球) が画面に入る距離
function outsideHome() {
  const box = new THREE.Box3().setFromObject(model);
  const sphere = box.getBoundingSphere(new THREE.Sphere());
  shipRadius = Math.max(sphere.radius, 0.5);
  const dir = new THREE.Vector3().addScaledVector(SHIP_LEFT, 1).addScaledVector(SHIP_FORWARD, 1).addScaledVector(SHIP_UP, 0.8).normalize();
  const vHalf = THREE.MathUtils.degToRad(50) / 2;
  const hHalf = Math.atan(Math.tan(vHalf) * camera.aspect);
  const dist = shipRadius / Math.sin(Math.min(vHalf, hHalf)) * 1.05;
  const s = new THREE.Spherical().setFromVector3(dir.multiplyScalar(dist));
  return { target: sphere.center.clone(), radius: s.radius, theta: s.theta, phi: s.phi };
}

function goOutsideHome() {
  const h = outsideHome();
  outside.target.copy(h.target); outside.radius = h.radius; outside.theta = h.theta; outside.phi = h.phi;
  setMode('outside');
}

// 位置 (place: 船内の位置のリストの 1 つ) に移る (船内表示にする)
function goPlace(place) {
  inside.pos.copy(place.pos);
  if (place.look) {
    // 見る点があれば (医療ベッド)、その点の向きにする (見下ろすときは pitch が負)
    const d = place.look.clone().sub(place.pos);
    inside.yaw = Math.atan2(-d.x, -d.z);   // カメラは yaw = 0 で -Z を見る
    inside.pitch = Math.atan2(d.y, Math.hypot(d.x, d.z));
  } else {
    inside.yaw = Math.atan2(-place.dir.x, -place.dir.z);   // カメラは yaw = 0 で -Z を見る
    inside.pitch = 0;
  }
  inside.fov = 70;
  setMode('inside');
}

function goInsideHome() {
  if (inside.home) goPlace(inside.home);
  else {
    // 操縦席が無い船は船の真ん中から前を見る
    const box = new THREE.Box3().setFromObject(model);
    goPlace({ pos: box.getCenter(new THREE.Vector3()), dir: SHIP_FORWARD.clone() });
  }
}

document.getElementById('btnOutside').addEventListener('click', () => { if (model) setMode('outside'); canvas.focus(); });
document.getElementById('btnInside').addEventListener('click', () => {
  if (!model) return;
  if (!inside.entered) { inside.entered = true; goInsideHome(); } else setMode('inside');
  canvas.focus();
});

// ===== 船内の位置 (操縦席・エレベーター・貨物室・タレット) =====
// ノード名 (小文字にして) で分ける。hardpoint_ で始まるものだけ見る。
//   除くもの: access (乗り降りの位置 seat_access / seataccess)・radar・controller・dashboard・camera・regen・relay を含むもの
//   操縦席: seat と pilot を含み copilot を含まない (例 hardpoint_seat_pilot、X1 は hardpoint_pilot_seat)
//   貨物室: cargo_bay または cargogrid を含む (例 hardpoint_cargo_bay、hardpoint_cargogrid_main_left)
//   タレット: turret を含み door を含まない (例 hardpoint_remote_turret_top、hardpoint_turret_base_upper)
//   エレベーター: elevator を含む、または _lift / _droplift の語がある (例 hardpoint_droplift、hardpoint_door_elevator)。
//     door を含まないものがあればそれだけ、無ければ door を含むもの (600i は hardpoint_droplift と hardpoint_droplift_door が同じ所にあるため)
const KINDS = [
  { key: 'pilot', label: '操縦席', eye: EYE_SEATED },
  { key: 'elevator', label: 'エレベーター', eye: EYE_STANDING },
  { key: 'cargo', label: '貨物室', eye: EYE_STANDING },
  { key: 'turret', label: 'タレット', eye: EYE_SEATED },
  { key: 'medbed', label: '医療ベッド', eye: EYE_STANDING },
];

function classify(rawName) {
  const n = (rawName || '').toLowerCase();
  // 医療ベッドは取り付け位置が無く、ベッドの部品だけの船もある (C8R Pisces Rescue: ノード名の無いメッシュ
  // Objects/Spaceships/Ships/ANVL/Pisces/Interior/ANVL_pisces_med_bed.cga。three.js はメッシュ名から名前を作る)。
  // hardpoint_ でなくても med_bed / medbed を含めば医療ベッドにする (扉・画面・ガラスは除く)
  if (/med_?bed/.test(n) && !/(door|screen|glass)/.test(n)) return 'medbed';
  if (!n.startsWith('hardpoint_')) return null;
  if (/(access|radar|controller|dashboard|camera|regen|relay)/.test(n)) return null;
  if (n.includes('seat') && n.includes('pilot') && !n.includes('copilot')) return 'pilot';
  // 医療ベッド: medbed を含む (例 Cutlass Red の hardpoint_MedBed_Left / _Right。--dump-hierarchy で確かめたもの)
  if (n.includes('medbed')) return 'medbed';
  if (n.includes('cargo_bay') || n.includes('cargogrid')) return 'cargo';
  if (n.includes('turret')) return n.includes('door') ? null : 'turret';
  // エレベーターの操作盤 (例 Apollo の hardpoint_elevator_control_panel_ext) はエレベーターにしない
  if ((n.includes('elevator') || /_(drop)?lift(_|$)/.test(n)) && !n.includes('panel')) return 'elevator';
  return null;
}

function collectPlaces(root) {
  root.updateMatrixWorld(true);
  // 種類ごとの入れ物は KINDS から作る (種類を足したときに入れ物を足し忘れると、下の found[k.key] で止まるため)
  const found = Object.fromEntries(KINDS.map(k => [k.key, []]));
  root.traverse(o => {
    const kind = classify(o.name);
    if (!kind) return;
    const pos = o.getWorldPosition(new THREE.Vector3());
    // 向きはノードの +Y 軸 (CryEngine の前) を水平にしたもの。水平の成分がほとんど無ければ船の前
    const dir = new THREE.Vector3(0, 1, 0).transformDirection(o.matrixWorld);
    dir.y = 0;
    if (dir.length() < 0.2) dir.copy(SHIP_FORWARD); else dir.normalize();
    found[kind].push({ name: o.name, pos, dir, door: o.name.toLowerCase().includes('door') });
  });
  const noDoor = found.elevator.filter(p => !p.door);
  if (noDoor.length > 0) found.elevator = noDoor;

  const result = [];
  for (const k of KINDS) {
    // 同じ種類で 0.5 m 以内に重なるもの (同じ名前のノードが入れ子になっているもの等) は 1 つにする
    const list = [];
    for (const p of found[k.key]) if (!list.some(q => q.pos.distanceTo(p.pos) < 0.5)) list.push(p);
    // 前から後ろの順 (前 = -Z)
    list.sort((a, b) => a.pos.z - b.pos.z);
    list.forEach((p, i) => {
      const place = {
        kind: k.key,
        label: list.length > 1 ? `${k.label} ${i + 1}` : k.label,
        name: p.name,
        pos: p.pos.clone().addScaledVector(SHIP_UP, k.eye),
        dir: p.dir,
      };
      if (k.key === 'medbed') {
        // 医療ベッドは、ベッドの上から前を向くと廊下を見てしまう (Apollo は廊下の両側 x = ±1.0 m に 5 台ずつ。利用者の指摘)。
        // ベッドの横 (船の真ん中の側へ 1.3 m。真ん中にあるベッドは後ろへ 1.3 m) に立ち、ベッドの上 (0.6 m) を見下ろす
        const side = Math.abs(p.pos.x) >= 0.3
          ? SHIP_LEFT.clone().multiplyScalar(p.pos.x > 0 ? 1.3 : -1.3)   // 右 (+X) のベッドは左へ、左のベッドは右へ
          : p.dir.clone().multiplyScalar(-1.3);
        place.pos = p.pos.clone().add(side).addScaledVector(SHIP_UP, k.eye);
        place.look = p.pos.clone().addScaledVector(SHIP_UP, 0.6);
      }
      result.push(place);
    });
  }
  return result;
}

// ===== 部屋 (利用者の決定: 船内の区画を部屋として出す) =====
// 区画は、StarBreaker が船内 (socpak) ごとに作るノード interior_<名前> (例 600i: bridge・armoury・module・front・middle・rear、C8X: pisces_int)。
// 名前は roomLabel で日本語にする (分からなければデータのまま)。light を含むもの (exterior_lights・pisces_lighting など照明だけの区画) は出さない。
// 位置は、その区画の部品の範囲の真ん中から真下に床を探し (8 m 以内)、立った目の高さに置く。床が見つからなければ真ん中
function roomPlaces(root) {
  root.updateMatrixWorld(true);
  const ray = new THREE.Raycaster();
  const result = [];
  for (const o of root.children.length ? collectRooms(root) : []) {
    const name = o.name.slice('interior_'.length);
    const box = new THREE.Box3().setFromObject(o);
    if (box.isEmpty()) continue;
    const center = box.getCenter(new THREE.Vector3());
    ray.set(center, SHIP_UP.clone().negate());
    ray.far = 8;
    const hit = ray.intersectObject(root, true)[0];
    const pos = hit ? hit.point.clone().addScaledVector(SHIP_UP, EYE_STANDING) : center;
    const label = roomLabel(name);
    // 語の表で日本語にできなかった名前は rawName を付け、アプリに AI で訳してもらう (requestRoomNames)
    result.push({ kind: 'room', label, name: o.name, pos, dir: SHIP_FORWARD.clone(), rawName: label === name ? name : null, num: '' });
  }
  // 前から後ろの順 (前 = -Z)
  result.sort((a, b) => a.pos.z - b.pos.z);
  // 同じ名前になった部屋は番号を付ける (例 Idris の main が並ぶとき)
  const count = new Map();
  for (const r of result) count.set(r.label, (count.get(r.label) ?? 0) + 1);
  const seq = new Map();
  for (const r of result) {
    if (count.get(r.label) > 1) {
      const k = (seq.get(r.label) ?? 0) + 1;
      seq.set(r.label, k);
      r.num = String(k);
      r.label = `${r.label} ${k}`;
    }
  }
  return result;
}

// 部屋の名前を日本語にする (利用者の要望: ある程度日本語化)。名前 (小文字) に含まれる語で決める。最初に当たった部屋の種類と、
// 位置の語 (左・右・前部・中央部・後部・上・下) を付ける。どの部屋の種類にも当たらず位置の語も無ければ、データの名前のまま。
// もとの名前はボタンの説明 (title) に出る。語は実データで見た区画の名前から (600i・C8X・C8R・Apollo Triage・Idris-P)
const ROOM_WORDS = [
  [/captains?_?quarters?|cptq/, '船長室'],
  [/crew_?dorm|dorm|quarters|bedroom|beds/, '乗員室'],
  [/crew_changing/, '更衣室'],
  [/hab(itation|s)?($|_)|hab_/, '居住区'],
  [/bridge|cockpit|command/, 'ブリッジ'],
  [/engin|engroom|(^|_)eng($|_)/, '機関室'],
  [/bathroom|bthrm|restroom|toilet|shower|hygiene/, '浴室'],
  [/triage|med_?bay|medical|infirmary|medic_/, '医療室'],
  [/prison/, '監房'],
  [/repair_bay/, '修理ベイ'],
  [/salvage/, 'サルベージ'],
  [/escape_?pods?/, '脱出ポッド'],
  [/cargo|crgo|argobay|(^|_)hold($|_)/, '貨物室'],
  [/hangar/, '格納庫'],
  [/docking|dock/, 'ドッキング'],
  [/armou?ry/, '武器庫'],
  [/briefing/, 'ブリーフィングルーム'],
  [/galley|kitchen|mess/, 'キッチン'],
  [/lounge|communal/, 'ラウンジ'],
  [/airlock/, 'エアロック'],
  [/elevator|lift/, 'エレベーター'],
  [/stairs/, '階段'],
  [/turr|gunner/, 'タレット'],
  [/foyer|entrance/, '入口'],
  [/components|systems/, '機器室'],
  [/seat_passenger/, '乗客席'],
  [/cabin/, 'キャビン'],
  [/mnt_|maintenance|crawlspace|accessway|companionway|walkway|hallway|corridor|cor_|(^|_)access($|_)/, '通路'],
  [/hub|centre_room/, 'ハブ'],
  [/modul|(^|_)mod_/, 'モジュール'],
  [/nose/, '機首'],
  [/tail/, '機尾'],
  [/neck/, '首部'],
  [/body|bdall|tdall/, '胴体'],
  [/(^|_)int($|_)|interior/, '船内'],   // 船の中全体の区画 (例 C8X の pisces_int、100i_interior)
];
const ROOM_PLACES = [
  [/left|stairsl|turrl|_l$/, '左'], [/right|stairsr|turrr|_r$/, '右'],
  [/front|frt|fwd/, '前部'], [/middle|mid/, '中央部'], [/rear|aft|back/, '後部'],
  [/upper|top/, '上'], [/lower|bottom/, '下'],
];
function roomLabel(name) {
  const n = name.toLowerCase();
  const kind = ROOM_WORDS.find(([re]) => re.test(n))?.[1] ?? '';
  const where = ROOM_PLACES.filter(([re]) => re.test(n)).map(([, w]) => w).join('・');
  if (!kind && !where) return name;
  if (!kind) return where;
  return where ? `${kind} (${where})` : kind;
}

// 部屋ではない区画 (全船 279 隻の区画の名前を見て決めたもの): 外の照明のまとまり (base_ext_lg など _lg)、窓・照明・目印・部品の区切り
// (glass・glows・helper・frame・button・detail・yoke・vis_areas・markup)、船の外 (exterior・ext)
const ROOM_SKIP = /(^|_)lg($|_)|(^|_)(glass|glows?|helper|frame|button|detail|yoke|vis_areas|exterior|ext|markup)($|_)/;

function collectRooms(root) {
  const list = [];
  root.traverse(o => {
    const n = o.name || '';
    if (n.startsWith('interior_') && !/light/i.test(n) && !ROOM_SKIP.test(n.slice('interior_'.length).toLowerCase())) list.push(o);
  });
  return list;
}

// ===== 部屋の名前の AI 訳 (利用者の要望: 新しく見つけた英語の名前は AI 翻訳に入れる) =====
// 語の表で日本語にできなかった部屋の名前をアプリに送り (chrome.webview.postMessage {type:'roomNames', names})、
// アプリが AI で訳して覚えたもの ({type:'roomNames', map: {名前: 日本語}}) が返ってきたら、リストの名前を差し替える
let currentPlaces = [];
function requestRoomNames(places) {
  const names = [...new Set(places.filter(p => p.rawName).map(p => p.rawName))];
  if (names.length === 0) return;
  try { window.chrome?.webview?.postMessage({ type: 'roomNames', names }); } catch { }
}
try {
  window.chrome?.webview?.addEventListener('message', e => {
    const d = e.data;
    if (!d || d.type !== 'roomNames' || !d.map) return;
    let changed = false;
    for (const p of currentPlaces) {
      const ja = p.rawName ? d.map[p.rawName] : null;
      if (!ja) continue;
      p.label = p.num ? `${ja} ${p.num}` : ja;
      p.name = `${p.name} (AI 訳)`;
      p.rawName = null;
      changed = true;
    }
    if (changed) showPlaces(currentPlaces);
  });
} catch { }

function showPlaces(places) {
  const box = document.getElementById('places');
  box.textContent = '';
  if (places.length === 0) {
    const d = document.createElement('div');
    d.className = 'none';
    d.textContent = '(データにありません)';
    box.appendChild(d);
    return;
  }
  // 種類ごとに親子にする (利用者の要望: タレットがいっぱい並ぶ)。1 つだけの種類はそのまま 1 つのボタン、
  // 2 つ以上の種類は親のボタン「タレット (20)」を押すと子 (タレット 1〜20) を開く・閉じる。部屋は親を「部屋」にする
  const groups = new Map();
  for (const p of places) {
    if (!groups.has(p.kind)) groups.set(p.kind, []);
    groups.get(p.kind).push(p);
  }
  const placeButton = p => {
    const b = document.createElement('button');
    b.textContent = p.label;
    b.title = p.name;
    b.addEventListener('click', () => { inside.entered = true; goPlace(p); canvas.focus(); });
    return b;
  };
  for (const [kind, list] of groups) {
    if (list.length === 1 && kind !== 'room') { box.appendChild(placeButton(list[0])); continue; }
    const label = kind === 'room' ? '部屋' : (KINDS.find(k => k.key === kind)?.label ?? kind);
    const parent = document.createElement('button');
    const children = document.createElement('div');
    children.className = 'children';
    children.hidden = true;
    // 閉じているときは ▼ (押すと広がる)、開いているときは ▲ (押すと閉じる)
    const setText = () => { parent.textContent = `${children.hidden ? '▼' : '▲'} ${label} (${list.length})`; };
    setText();
    parent.addEventListener('click', () => { children.hidden = !children.hidden; setText(); });
    for (const p of list) children.appendChild(placeButton(p));
    box.appendChild(parent);
    box.appendChild(children);
  }
}

// ===== マウス・キー =====
let drag = null;   // { button, x, y }
canvas.addEventListener('contextmenu', e => e.preventDefault());
// 右ドラッグで枠の外に出てから離したときも、ブラウザのメニュー (戻る・最新の情報に更新など) を出さない (アプリ側でも切っている。Ship3DWeb)
window.addEventListener('contextmenu', e => e.preventDefault());
canvas.addEventListener('pointerdown', e => {
  canvas.focus();
  if (e.button !== 0 && e.button !== 2) return;
  drag = { button: e.button, x: e.clientX, y: e.clientY };
  canvas.setPointerCapture(e.pointerId);
});
canvas.addEventListener('pointerup', e => { drag = null; try { canvas.releasePointerCapture(e.pointerId); } catch { } });
canvas.addEventListener('pointermove', e => {
  if (!drag || !model) return;
  const dx = e.clientX - drag.x, dy = e.clientY - drag.y;
  drag.x = e.clientX; drag.y = e.clientY;
  if (drag.button === 0) {
    if (mode === 'outside') {
      outside.theta -= dx * 0.005;
      outside.phi = THREE.MathUtils.clamp(outside.phi - dy * 0.005, 0.01, Math.PI - 0.01);
    } else {
      inside.yaw -= dx * 0.003;
      inside.pitch = THREE.MathUtils.clamp(inside.pitch - dy * 0.003, -1.55, 1.55);
    }
  } else {
    // 平行移動: 画面の右・上の向きに動かす (船外は距離に比例、船内は 1 画素 1 cm)
    const right = new THREE.Vector3().setFromMatrixColumn(camera.matrixWorld, 0);
    const up = new THREE.Vector3().setFromMatrixColumn(camera.matrixWorld, 1);
    const k = mode === 'outside' ? outside.radius * 0.0015 : 0.01;
    const move = right.multiplyScalar(-dx * k).addScaledVector(up, dy * k);
    if (mode === 'outside') outside.target.add(move); else inside.pos.add(move);
  }
  applyCamera();
});
canvas.addEventListener('wheel', e => {
  e.preventDefault();
  if (!model) return;
  if (mode === 'outside') {
    outside.radius = THREE.MathUtils.clamp(outside.radius * Math.exp(e.deltaY * 0.001), 0.2, shipRadius * 20);
  } else {
    const fwd = new THREE.Vector3();
    camera.getWorldDirection(fwd);
    inside.pos.addScaledVector(fwd, -e.deltaY * 0.005);
  }
  applyCamera();
}, { passive: false });

const keys = new Set();
const MOVE_CODES = ['KeyW', 'KeyA', 'KeyS', 'KeyD', 'ArrowUp', 'ArrowDown'];
window.addEventListener('keydown', e => {
  if (!model) return;
  if (MOVE_CODES.includes(e.code)) { keys.add(e.code); e.preventDefault(); return; }
  if (e.code === 'Insert' || e.code === 'Delete') {
    // 拡大 / 縮小 (船外は近づく・離れる、船内は画角を狭める・広げる)。押し続けると繰り返す
    const zoomIn = e.code === 'Insert';
    if (mode === 'outside') outside.radius = THREE.MathUtils.clamp(outside.radius * (zoomIn ? 0.9 : 1 / 0.9), 0.2, shipRadius * 20);
    else inside.fov = THREE.MathUtils.clamp(inside.fov * (zoomIn ? 0.9 : 1 / 0.9), 15, 100);
    applyCamera();
    e.preventDefault();
  } else if (e.code === 'Home') {
    if (mode === 'outside') goOutsideHome(); else goInsideHome();
    e.preventDefault();
  }
});
window.addEventListener('keyup', e => keys.delete(e.code));
window.addEventListener('blur', () => keys.clear());

function moveByKeys(dt) {
  if (keys.size === 0) return;
  const speed = mode === 'outside' ? Math.max(outside.radius * 0.5, 1) : INSIDE_SPEED;
  const fwd = new THREE.Vector3();
  camera.getWorldDirection(fwd);
  fwd.y = 0;
  if (fwd.lengthSq() < 1e-6) fwd.set(0, 0, -1); else fwd.normalize();
  const right = new THREE.Vector3().crossVectors(fwd, SHIP_UP).normalize();
  const move = new THREE.Vector3();
  if (keys.has('KeyW')) move.add(fwd);
  if (keys.has('KeyS')) move.sub(fwd);
  if (keys.has('KeyD')) move.add(right);
  if (keys.has('KeyA')) move.sub(right);
  if (keys.has('ArrowUp')) move.add(SHIP_UP);
  if (keys.has('ArrowDown')) move.sub(SHIP_UP);
  if (move.lengthSq() === 0) return;
  move.normalize().multiplyScalar(speed * dt);
  if (mode === 'outside') outside.target.add(move); else inside.pos.add(move);
  applyCamera();
}

// ===== 描画の繰り返し =====
let last = performance.now();
function frame(now) {
  const dt = Math.min((now - last) / 1000, 0.1);
  last = now;
  if (model) {
    moveByKeys(dt);
    // 平行光は船の左斜め前の上から当てる (カメラが動いても向きは変えない)
    renderer.render(scene, camera);
  }
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);

// ===== 小さな絵 (?thumb=1) =====
// 船外の初めの位置 (goOutsideHome。左斜め前方の上から) で 1 コマ描き、PNG の data URL をアプリに返す。描いた直後に toDataURL で取る (描画バッファは次の描画まで残る)
function renderThumb() {
  try {
    renderer.render(scene, camera);
    const png = canvas.toDataURL('image/png');
    window.chrome?.webview?.postMessage({ type: 'thumb', png });
  } catch (e) {
    reportError(`小さな絵を描けませんでした: ${e.message}`);
  }
}

// 小さな絵: &table=<URL> があれば、その材質の表 (色付けなし・古い版の GLB の標準の表) を当ててから描く。当てられなければ描かずに失敗を返す
// (アプリは表を当てた絵を別の名前で保存するので、表を当てない絵をその名前で返さない)
async function thumbWithTable() {
  const turl = params.get('table');
  if (turl) {
    try {
      const res = await fetch(turl);
      if (!res.ok) throw new Error(`HTTP ${res.status}`);
      const made = await buildMaterials(await res.json());
      meshEntries.forEach((e, i) => { e.o.material = made.perEntry[i] ?? e.orig; });
    } catch (err) {
      reportError(`小さな絵に材質の表を当てられませんでした: ${err?.message ?? err}`);
      return;
    }
  }
  renderThumb();
}

// ===== 材質の見え方の直し =====
// 画像 (テクスチャ) の無い白い材質は灰色 (#888888) で描く (2026-11-05、利用者の指示「bitmap がないのか真っ白だが見えにくい。色がないのは灰色で」)。
// 画像のある面・白でない色の面・ガラス (transmission) は変えない。ライトの当たり方も変えない。
// GLTFLoader は baseColorFactor を material.color (線形)、baseColorTexture を material.map に入れる。白は r・g・b が 0.9 以上
function adjustMaterial(m) {
  // 自己発光 (emissiveFactor) が入っているのに発光用の画像 (emissiveMap) が無い材質は、白い光を全面に足して真っ白になる
  // (2026-11-05、利用者の報告: Cryo-Star SL のクーラー。GLB の材質 13 のうち 11 が emissive 1,1,1 で発光の画像なし)。発光の画像が無ければ発光を 0 にする
  if (m.emissive && !m.emissiveMap) m.emissive.setHex(0x000000);
  if (m.map || !m.color || (m.transmission ?? 0) > 0) return;
  if (m.color.r >= 0.9 && m.color.g >= 0.9 && m.color.b >= 0.9) m.color.setHex(0x888888);
}

// ===== 塗装の切り替え・色付けの設定 (2026-11-05、利用者の指示「右端に縦のリストでバリエーションを表示して切替で見れるようにしたい」・
// 「"船・装備・武器の 3D は常に色付け" これは設定で切れるようにしてください。」) =====
// 形・画像は読み込んだ GLB のまま、アプリが作った材質の表 (塗装つきの書き出しの materials と、mesh・primitive ごとの材質の番号) で材質だけを差し替える。
// 材質は GLTFLoader と同じ作り方 (parser の loadMaterial・assignFinalMaterial と同じ複製) で作る。見ている向き・拡大・船内／船外はそのまま
let gltfParser = null;
let meshEntries = [];        // { o: Mesh, mi: glTF の mesh の番号, pi: primitive の番号, orig: 標準の材質 }
let paintMaterials = [];     // 今当てている塗装の材質 (標準に戻す・別の塗装にするときに捨てる)
let currentPaint = '';       // 今当たっている塗装 ('' は標準)
let wantedPaint = '';        // 選ばれた塗装 (作っている間は currentPaint と違う)
let currentTable = '';       // 今当てている材質の表 ('' は GLB の材質のまま)
// 「標準」に当てる材質の表 (アプリの paintList の standardId)。GLB が古い版の材質の決め方で書かれていれば '~std' (今のコードの標準の材質)、今の版なら '' (GLB のまま)
let standardTable = '';
let applySeq = 0;
const tables = new Map();    // 材質の表の id → 材質の表 (届いたもの)
// 塗装 (一覧の id) に当てる材質の表の id
function tableIdOf(id) { return id === '' ? standardTable : id; }
let paintItems = [];

function rememberMeshes(parser, root) {
  gltfParser = parser;
  meshEntries = [];
  root.traverse(o => {
    if (!o.isMesh) return;
    const a = parser.associations.get(o);
    if (a && a.meshes !== undefined && a.primitives !== undefined) meshEntries.push({ o, mi: a.meshes, pi: a.primitives, orig: o.material });
  });
}

const busyEl = document.getElementById('paintBusy');
const busyText = document.getElementById('paintBusyText');
let busyTimer = 0;
function showBusy(text) {
  clearTimeout(busyTimer);
  busyEl.classList.remove('error');
  busyText.textContent = text;
  busyEl.classList.toggle('hidden', !text);
}
function showPaintError(text) {
  clearTimeout(busyTimer);
  busyEl.classList.add('error');
  busyText.textContent = text;
  busyEl.classList.remove('hidden');
  busyTimer = setTimeout(() => { busyEl.classList.add('hidden'); busyEl.classList.remove('error'); }, 6000);
}

function labelOf(id) {
  if (id === '~nopal') return '色付けなし';
  if (id === '~std' || id === '') return '標準';
  return paintItems.find(p => p.id === id)?.en ?? id;
}

// 右端の一覧 (いちばん上が「標準」)。今の塗装 (選んで作っているものを含む) のボタンを on にする
function showPaints() {
  const box = document.getElementById('paints');
  box.textContent = '';
  for (const p of paintItems) {
    const b = document.createElement('button');
    b.textContent = p.en;
    if (p.ja && p.ja !== p.en) {
      const j = document.createElement('span');
      j.className = 'ja';
      j.textContent = p.ja;
      b.appendChild(j);
    }
    b.title = p.id ? p.id : 'いま 3D に出ている姿 (既定の塗装)';
    b.classList.toggle('on', p.id === wantedPaint);
    if (p.ng) {
      // 出せない塗装: 名前の後ろに印を付け、押せなくする
      b.firstChild.textContent = `${p.en} (出せない)`;
      b.classList.add('ng');
      b.disabled = true;
      b.title = `${p.id}
${p.ng}`;
    }
    b.addEventListener('click', () => { selectPaint(p.id); canvas.focus(); });
    box.appendChild(b);
  }
  document.getElementById('paintSide').classList.toggle('hidden', paintItems.length === 0 || isItem);
}

function selectPaint(id) {
  wantedPaint = id;
  showPaints();
  const tid = tableIdOf(id);
  if (tid === '' || tables.has(tid)) { applyWanted(); return; }
  showBusy(`塗装「${labelOf(id)}」を作っています...`);
  try { window.chrome?.webview?.postMessage({ type: 'paintTable', ship: shipName, id: tid }); } catch { }
  applyWanted();   // 前に選ばれて当てている途中のものを止める (表が届いたらもう一度呼ばれる)
}

// 選ばれた塗装を当てる (表が届いていて、GLB を読み込んであれば)
async function applyWanted() {
  if (!model || !gltfParser) return;
  const id = wantedPaint;
  const tid = tableIdOf(id);
  const seq = ++applySeq;   // 当てている途中のもの (前に選ばれたもの) は、ここで止まる
  if (tid === currentTable) { currentPaint = id; showBusy(''); return; }
  if (tid !== '' && !tables.has(tid)) return;   // 作っている (届いたら呼ばれる)
  try {
    if (tid === '') {
      for (const e of meshEntries) e.o.material = e.orig;
      disposePaintMaterials([]);
    } else {
      showBusy(`塗装「${labelOf(id)}」を当てています...`);
      const made = await buildMaterials(tables.get(tid));
      if (seq !== applySeq) { for (const m of made.all) m.dispose(); return; }   // 待つ間に別のものが選ばれた
      meshEntries.forEach((e, i) => { e.o.material = made.perEntry[i] ?? e.orig; });
      disposePaintMaterials(made.all);
    }
    currentPaint = id;
    currentTable = tid;
    if (seq === applySeq) showBusy('');
  } catch (err) {
    if (seq !== applySeq) return;
    failPaint(tid, `塗装「${labelOf(id)}」に切り替えられませんでした: ${err?.message ?? err}`);
  }
}

function disposePaintMaterials(keep) {
  const k = new Set(keep);
  for (const m of paintMaterials) if (!k.has(m)) m.dispose();   // 画像 (テクスチャ) は標準の材質と共有なので捨てない
  paintMaterials = keep;
}

// 切り替えられなかった (tid は材質の表の id): 元の塗装のままにして、短い知らせを出す。
// 今選んでいる塗装の表でなければ (前に選んで、もう選び直したもの)、今の表示 (作っています... など) は消さず、ログに送るだけ
function failPaint(tid, text) {
  tables.delete(tid);
  if (tableIdOf(wantedPaint) === tid) {
    if (wantedPaint !== currentPaint) { wantedPaint = currentPaint; showPaints(); }
    showPaintError(text);
  }
  try { window.chrome?.webview?.postMessage({ type: 'error', message: text }); } catch { }
}

// 材質の表から、覚えた mesh ごとの材質を作る。GLTFLoader の loadMaterial を表の materials で呼ぶ (呼ぶ間だけ parser.json.materials を差し替える。
// loadMaterial と拡張は材質の定義をその場で読むので、作り始めたら元に戻してよい)。primitive ごとの複製は assignFinalMaterial と同じ決まり
async function buildMaterials(table) {
  const parser = gltfParser;
  const saved = parser.json.materials;
  const baseOf = new Map();
  const want = [];
  parser.json.materials = table.materials;
  try {
    for (const e of meshEntries) {
      const row = table.prims?.[e.mi];
      if (!row || e.pi >= row.length) throw new Error('材質の表が 3D モデルと合いません');
      const idx = row[e.pi];
      want.push(idx);
      if (idx === null || idx === undefined || baseOf.has(idx)) continue;
      if (!table.materials[idx]) throw new Error('材質の表が 3D モデルと合いません');
      baseOf.set(idx, parser._invokeOne(ext => ext.loadMaterial && ext.loadMaterial(idx)));
    }
  } finally {
    parser.json.materials = saved;
  }
  const bases = new Map();
  for (const [idx, p] of baseOf) bases.set(idx, await p);
  const finals = new Map();
  const all = [...bases.values()];
  const perEntry = meshEntries.map((e, i) => {
    const idx = want[i];
    if (idx === null || idx === undefined) return null;
    const base = bases.get(idx);
    // assignFinalMaterial と同じ: 接線が無ければ法線の画像の向きを直した複製、頂点の色があれば vertexColors、法線が無ければ flatShading の複製
    const g = e.o.geometry;
    const dt = g.attributes.tangent === undefined, vc = g.attributes.color !== undefined, fl = g.attributes.normal === undefined;
    if (!dt && !vc && !fl) return base;
    const key = `${base.uuid}:${dt ? 'dt' : ''}:${vc ? 'vc' : ''}:${fl ? 'fl' : ''}`;
    let m = finals.get(key);
    if (!m) {
      m = base.clone();
      if (vc) m.vertexColors = true;
      if (fl) m.flatShading = true;
      if (dt) {
        if (m.normalScale) m.normalScale.y *= -1;
        if (m.clearcoatNormalScale) m.clearcoatNormalScale.y *= -1;
      }
      finals.set(key, m);
      all.push(m);
    }
    return m;
  });
  for (const m of all) adjustMaterial(m);
  return { perEntry, all };
}

if (paintIO) {
  try {
    window.chrome?.webview?.addEventListener('message', async e => {
      const d = e.data;
      if (!d || d.ship !== shipName) return;
      if (d.type === 'paintList') {
        paintItems = Array.isArray(d.items) ? d.items : [];
        standardTable = d.standardId || '';
        showPaints();
        // 初めの塗装。保存が無くても、古い版の GLB なら標準の表を当てる
        if (d.initial || standardTable) selectPaint(d.initial || '');
      } else if (d.type === 'paintTable') {
        if (d.error) {
          // 形の照合で出せない塗装は、一覧で押せない形にする (次に開いたときもアプリが覚えていて同じ形で出す)
          if (d.unusable) { const it = paintItems.find(p => p.id === d.id); if (it) { it.ng = d.error; showPaints(); } }
          failPaint(d.id, `塗装「${labelOf(d.id)}」を作れませんでした: ${d.error}`);
          return;
        }
        try {
          const res = await fetch(d.url);
          if (!res.ok) throw new Error(`HTTP ${res.status}`);
          tables.set(d.id, await res.json());
        } catch (err) {
          failPaint(d.id, `塗装「${labelOf(d.id)}」の材質の表を読めませんでした: ${err?.message ?? err}`);
          return;
        }
        if (d.id === tableIdOf(wantedPaint)) applyWanted();
      }
    });
    window.chrome?.webview?.postMessage({ type: 'paintInit', ship: shipName });
  } catch { }
}

// ===== 読み込み =====
if (!glbUrl) {
  reportError('表示する GLB が指定されていません。');
} else {
  const loader = new GLTFLoader();
  loader.load(glbUrl, gltf => {
    showMessage('組み立て中...');
    const root = gltf.scene;
    // GLB のライトを取り除く (KHR_lights_punctual。描画が重くなるため)
    const lights = [];
    root.traverse(o => { if (o.isLight) lights.push(o); });
    for (const l of lights) l.removeFromParent();
    // 名前に demo が入った部品 (と、その下の部品) は描かない。仮のモデルとみられるため (利用者の決定)。
    // 実物で見たもの: リレーの relay_demo_1fuse_s01 / relay_demo_2fuse_s01 / relay_demo_3fuse(_s01) (600i・X1・Gladius・C8X)。
    // 船の範囲 (下の Box3) にも入れない
    const demos = [];
    root.traverse(o => { if (/demo/i.test(o.name || '')) demos.push(o); });
    for (const o of demos) o.removeFromParent();
    // 材質の見え方の直し (adjustMaterial) を、どの材質にも 1 回ずつ当てる (塗装を切り替えたときの材質にも同じものを当てる)
    const seenMats = new Set();
    root.traverse(o => {
      if (!o.isMesh) return;
      for (const m of Array.isArray(o.material) ? o.material : [o.material]) {
        if (!m || seenMats.has(m)) continue;
        seenMats.add(m);
        adjustMaterial(m);
      }
    });
    scene.add(root);
    model = root;
    // 塗装の切り替えのために、glTF の mesh・primitive の番号と、今の (標準の) 材質を覚えておく
    rememberMeshes(gltf.parser, root);

    const box = new THREE.Box3().setFromObject(model);
    const sphere = box.getBoundingSphere(new THREE.Sphere());
    const sunDir = new THREE.Vector3().addScaledVector(SHIP_LEFT, 0.6).addScaledVector(SHIP_FORWARD, 0.6).addScaledVector(SHIP_UP, 1).normalize();
    sun.position.copy(sphere.center).addScaledVector(sunDir, Math.max(sphere.radius, 1) * 3);
    sun.target.position.copy(sphere.center);

    const places = collectPlaces(model).concat(roomPlaces(model));
    currentPlaces = places;
    inside.home = places.find(p => p.kind === 'pilot') ?? null;
    showPlaces(places);
    requestRoomNames(places);
    goOutsideHome();
    showMessage('');
    if (isThumb) { thumbWithTable(); return; }
    canvas.focus();
    // 読み込みの間に届いていた塗装 (初めの塗装) を当てる
    applyWanted();
  }, xhr => {
    if (xhr.total > 0) {
      const pct = Math.floor(xhr.loaded * 100 / xhr.total);
      showMessage(`読み込み中 ${pct}% (${(xhr.loaded / 1048576).toFixed(0)} MB / ${(xhr.total / 1048576).toFixed(0)} MB)`);
    } else {
      showMessage(`読み込み中 ${(xhr.loaded / 1048576).toFixed(0)} MB`);
    }
  }, err => {
    reportError(`GLB を読み込めませんでした: ${err?.message ?? err}`);
  });
}
</script>
</body>
</html>
