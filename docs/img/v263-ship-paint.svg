<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 520" width="900" height="520" role="img" aria-labelledby="t d">
  <title id="t">船の 3D の塗装の一覧（仮の図）</title>
  <desc id="d">船の 3D の右端、「船内の位置」の欄の右に「塗装」の一覧が縦に並びます。いちばん上が「標準」で、押すとその塗装に切り替わります。初めて選んだ塗装は作るのに数秒かかり、右下に「塗装「…」を作っています...」と出ます。</desc>
  <style>
    .f  { font-family: sans-serif; }
    .tx { font-size: 13px; fill: #eee; }
    .h3 { font-size: 13px; fill: #ccc; font-weight: 700; }
    .tt { font-size: 13px; fill: #eee; font-weight: 700; }
    .hp { font-size: 12px; fill: #bbb; }
    .bz { font-size: 13px; fill: #fff; font-weight: 700; }
    .no { font-size: 15px; fill: #fff; font-weight: 700; }
    .cap { font-size: 12.5px; fill: #c9d6e3; }
  </style>
  <defs>
    <g id="b"><rect x="0" y="0" width="158" height="26" rx="3" fill="#3a404c" stroke="#555c6a"/></g>
    <g id="bon"><rect x="0" y="0" width="158" height="26" rx="3" fill="#3d6db5" stroke="#5a8ad6"/></g>
  </defs>

  <rect x="0" y="0" width="900" height="520" fill="#1b1e24"/>

  <!-- 3D の表示 -->
  <rect x="10" y="10" width="54" height="26" rx="3" fill="#3d6db5" stroke="#5a8ad6"/><text class="f tx" x="37" y="28" text-anchor="middle">船外</text>
  <rect x="70" y="10" width="54" height="26" rx="3" fill="#3a404c" stroke="#555c6a"/><text class="f tx" x="97" y="28" text-anchor="middle">船内</text>
  <text class="f tt" x="136" y="28">AEGS Gladius</text>
  <rect x="514" y="10" width="28" height="28" rx="4" fill="#c62828" stroke="#e57373"/><text class="f tt" x="528" y="29" text-anchor="middle">✕</text>
  <!-- 船 (それらしい形) -->
  <g transform="translate(280,250)">
    <polygon points="-200,10 -60,-30 120,-20 200,0 120,20 -60,30" fill="#5d6a5a" stroke="#88957f"/>
    <polygon points="-40,-28 40,-90 80,-86 40,-22" fill="#4f5a4c" stroke="#7c8873"/>
    <polygon points="-40,28 40,90 80,86 40,22" fill="#4f5a4c" stroke="#7c8873"/>
    <ellipse cx="90" cy="0" rx="34" ry="10" fill="#9ad7ff" fill-opacity="0.55"/>
  </g>
  <text class="f hp" x="10" y="478">左ドラッグ: 回転 ／ 右ドラッグ: 平行移動 ／ ホイール: 拡大縮小 …</text>
  <!-- 作っている知らせ -->
  <rect x="280" y="430" width="266" height="46" fill="rgba(0,0,0,0.8)" stroke="#888"/>
  <text class="f bz" x="413" y="450" text-anchor="middle">塗装「Gladius Dunlevy」を作っています...</text>
  <rect x="313" y="458" width="200" height="8" fill="#333" stroke="#777"/><rect x="371" y="458" width="60" height="8" fill="#4a8"/>

  <!-- 船内の位置 -->
  <rect x="552" y="0" width="170" height="500" fill="#262a33" stroke="#3a3f4a"/>
  <text class="f h3" x="558" y="22">船内の位置</text>
  <use href="#b" x="558" y="32"/><text class="f tx" x="566" y="50">操縦席</text>

  <!-- 塗装 -->
  <rect x="722" y="0" width="178" height="500" fill="#262a33" stroke="#3a3f4a"/>
  <text class="f h3" x="728" y="22">塗装</text>
  <use href="#b" x="728" y="32"/><text class="f tx" x="736" y="50">標準</text>
  <use href="#bon" x="728" y="62"/><text class="f tx" x="736" y="80">Gladius Dunlevy</text>
  <use href="#b" x="728" y="92"/><text class="f tx" x="736" y="110">Gladius Invictus Blue …</text>
  <use href="#b" x="728" y="122"/><text class="f tx" x="736" y="140">Gladius Nightbreak Livery</text>
  <use href="#b" x="728" y="152"/><text class="f tx" x="736" y="170">Gladius Pirate Livery</text>
  <use href="#b" x="728" y="182"/><text class="f tx" x="736" y="200">Gladius Valiant Livery</text>
  <text class="f hp" x="728" y="226">（数が多いと欄の中で</text>
  <text class="f hp" x="728" y="242">スクロールします）</text>

  <rect x="0" y="500" width="900" height="20" fill="#1b222c"/>
  <text class="f cap" x="10" y="514">仮の図。船 AEGS Gladius と塗装の名前は例です（一覧の中身はアプリが Data.p4k から決めます）。実際の画面と細部が違うことがあります</text>

  <!-- 番号 -->
  <g class="f">
    <circle cx="884" cy="18" r="13" fill="#ff5a36" stroke="#fff" stroke-width="2"/><text class="no" x="884" y="23" text-anchor="middle">1</text>
    <circle cx="884" cy="45" r="13" fill="#ff5a36" stroke="#fff" stroke-width="2"/><text class="no" x="884" y="50" text-anchor="middle">2</text>
    <circle cx="884" cy="75" r="13" fill="#ff5a36" stroke="#fff" stroke-width="2"/><text class="no" x="884" y="80" text-anchor="middle">3</text>
    <circle cx="266" cy="453" r="13" fill="#ff5a36" stroke="#fff" stroke-width="2"/><text class="no" x="266" y="458" text-anchor="middle">4</text>
    <circle cx="706" cy="18" r="13" fill="#ff5a36" stroke="#fff" stroke-width="2"/><text class="no" x="706" y="23" text-anchor="middle">5</text>
  </g>
</svg>
