<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 560" width="900" height="560" role="img" aria-labelledby="t d">
  <title id="t">船舶管理の塗装の列と行（仮の図）</title>
  <desc id="d">上: ［船舶管理］→［所持船］の表の「塗装」の列。候補は「標準」、持っている塗装（名前の前に ★）、ほかの付けられる塗装。下: ［船舶管理］→［装備］の「現在の装備」の表のいちばん下の「塗装」の行。どちらも選ぶとすぐ保存し、同じ値です。</desc>
  <style>
    .f  { font-family: sans-serif; }
    .th { font-size: 12.5px; fill: #1a1a1a; }
    .tx { font-size: 12.5px; fill: #1a1a1a; }
    .gy { font-size: 12px; fill: #888; }
    .t2 { font-size: 13px; fill: #c9d6e3; font-weight: 700; }
    .bl { font-size: 12.5px; fill: #1565C0; font-weight: 700; }
    .no { font-size: 15px; fill: #fff; font-weight: 700; }
    .cap { font-size: 12.5px; fill: #c9d6e3; }
  </style>

  <rect x="0" y="0" width="900" height="560" rx="8" fill="#1b222c"/>

  <!-- 所持船 -->
  <text class="f t2" x="20" y="24">［船舶管理］→［所持船］</text>
  <rect x="20" y="34" width="860" height="200" fill="#fff" stroke="#8a8a8a"/>
  <rect x="20" y="34" width="860" height="26" fill="#f0f0f0" stroke="#ccc"/>
  <g class="f th">
    <text x="28" y="52">船名</text><text x="190" y="52">メーカー</text><text x="350" y="52">…</text><text x="420" y="52">塗装</text><text x="680" y="52">（ボタン）</text><text x="800" y="52">追加日</text>
  </g>
  <line x1="20" y1="90" x2="880" y2="90" stroke="#e0e0e0"/>
  <g class="f tx">
    <text x="28" y="80">Gladius</text><text x="190" y="80">Aegis Dynamics</text><text x="350" y="80">…</text>
    <rect x="416" y="64" width="236" height="22" fill="#fff" stroke="#0078d4"/><text x="422" y="80">★ Gladius Valiant Livery</text><text x="640" y="80">▾</text>
    <text x="28" y="110" fill="#888">（ほかの船の行）</text>
  </g>
  <!-- 開いた候補 -->
  <rect x="416" y="86" width="236" height="122" fill="#fff" stroke="#8a8a8a"/>
  <g class="f tx">
    <text x="424" y="104">標準</text>
    <rect x="417" y="110" width="234" height="22" fill="#cce4f7"/><text x="424" y="126">★ Gladius Valiant Livery</text>
    <text x="424" y="148">Gladius Dunlevy</text>
    <text x="424" y="170">Gladius Nightbreak Livery</text>
    <text x="424" y="192">Gladius Pirate Livery</text>
  </g>

  <!-- 装備 -->
  <text class="f t2" x="20" y="268">［船舶管理］→［装備］の「現在の装備」</text>
  <rect x="20" y="278" width="860" height="230" fill="#f3f3f3" stroke="#8a8a8a"/>
  <text class="f tx" x="30" y="302">船:</text>
  <rect x="56" y="288" width="240" height="22" fill="#fff" stroke="#adadad"/><text class="f tx" x="62" y="304">Gladius</text><text class="f tx" x="282" y="304">▾</text>
  <rect x="30" y="318" width="840" height="180" fill="#fff" stroke="#ccc"/>
  <rect x="30" y="318" width="840" height="24" fill="#f0f0f0" stroke="#ccc"/>
  <g class="f th">
    <text x="38" y="335">種別</text><text x="160" y="335">搭載枠</text><text x="330" y="335">デフォルト</text><text x="470" y="335">現在</text><text x="610" y="335">装備を設定</text>
  </g>
  <g class="f gy">
    <text x="38" y="364">（ほかの装備の行）</text>
    <text x="38" y="392">（ほかの装備の行）</text>
  </g>
  <line x1="30" y1="372" x2="870" y2="372" stroke="#e0e0e0"/><line x1="30" y1="400" x2="870" y2="400" stroke="#e0e0e0"/>
  <rect x="31" y="401" width="838" height="30" fill="#E3F2FD"/>
  <g class="f tx">
    <text x="38" y="421">塗装</text><text x="160" y="421">塗装</text><text x="330" y="421">標準</text>
  </g>
  <text class="f bl" x="470" y="421">Gladius Dunlevy</text>
  <rect x="606" y="405" width="250" height="22" fill="#fff" stroke="#0078d4"/><text class="f tx" x="612" y="421">Gladius Dunlevy</text><text class="f tx" x="842" y="421">▾</text>
  <text class="f gy" x="38" y="452">いちばん下が「塗装」の行です（付けられる塗装がある船だけ）</text>
  <text class="f gy" x="38" y="472">「搭載枠Size」「Size」「Class」の列は図では省いています</text>

  <text class="f cap" x="20" y="540">仮の図。船 AEGS Gladius と塗装の名前は例です。★ は My Hangar の同期で持っている塗装の例です。実際の画面と細部が違うことがあります</text>

  <!-- 番号 -->
  <g class="f">
    <circle cx="476" cy="47" r="13" fill="#ff5a36" stroke="#fff" stroke-width="2"/><text class="no" x="476" y="52" text-anchor="middle">1</text>
    <circle cx="668" cy="122" r="13" fill="#ff5a36" stroke="#fff" stroke-width="2"/><text class="no" x="668" y="127" text-anchor="middle">2</text>
    <circle cx="20" cy="416" r="13" fill="#ff5a36" stroke="#fff" stroke-width="2"/><text class="no" x="20" y="421" text-anchor="middle">3</text>
    <circle cx="880" cy="416" r="13" fill="#ff5a36" stroke="#fff" stroke-width="2"/><text class="no" x="880" y="421" text-anchor="middle">4</text>
  </g>
</svg>
