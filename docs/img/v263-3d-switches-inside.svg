<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 560" width="900" height="560" role="img" aria-labelledby="t d">
  <title id="t">ステーションの 3D の右上のスイッチ（中で見ているとき・仮の図）</title>
  <desc id="d">3D の表示の右上に、テクスチャ・色付け・現在位置のスイッチ、見出し「印」の 5 つのスイッチ（店・端末・エレベーター・トラム・クエストの扉・パネル・コメント）、見出し「キャプション」の 4 つのスイッチ（着陸パッド・ドッキングポート・外部貨物エレベーター・ハンガー）が縦に並びます。中で見ているときは印のスイッチが押せ、キャプションのスイッチは押せません。</desc>
  <style>
    .f  { font-family: sans-serif; }
    .sw { font-size: 13px; fill: #ddd; }
    .hd { font-size: 11px; fill: #aaa; }
    .lb { font-size: 17px; fill: #fff; font-weight: 700; }
    .hl { font-size: 15px; fill: #bff8ff; font-weight: 700; }
    .no { font-size: 15px; fill: #fff; font-weight: 700; }
    .cap { font-size: 12.5px; fill: #c9d6e3; }
  </style>
  <defs>
    <g id="on"><rect x="0" y="-12" width="30" height="16" rx="8" fill="#264" stroke="#4a8"/><circle cx="22" cy="-4" r="6" fill="#ddd"/></g>
  </defs>

  <!-- 3D の地 -->
  <rect x="0" y="0" width="900" height="560" fill="#111"/>
  <polygon points="40,520 860,520 640,330 260,330" fill="#3a352e"/>
  <polygon points="40,520 260,330 260,120 40,60" fill="#2b2a28"/>
  <polygon points="860,520 640,330 640,120 860,60" fill="#2b2a28"/>
  <polygon points="260,330 640,330 640,120 260,120" fill="#24282c"/>
  <line x1="260" y1="330" x2="640" y2="330" stroke="#4a4740"/>
  <rect x="300" y="240" width="90" height="90" fill="#3b4148"/>
  <rect x="520" y="250" width="70" height="80" fill="#3b4148"/>
  <rect x="560" y="258" width="24" height="36" fill="#7b5a2a"/>
  <!-- 印 (玉) -->
  <line x1="345" y1="236" x2="345" y2="200" stroke="#f55" stroke-width="2"/><circle cx="345" cy="196" r="7" fill="#f44"/>
  <line x1="572" y1="254" x2="572" y2="226" stroke="#fa3" stroke-width="2"/><circle cx="572" cy="222" r="6" fill="#f93"/>
  <circle cx="455" cy="300" r="7" fill="#fd3"/>
  <!-- 札 -->
  <rect x="214" y="128" width="262" height="58" fill="rgba(20,20,20,0.85)" stroke="#c8b45a" stroke-width="2"/>
  <text class="f lb" x="226" y="152">Casaba Outlet（装備の店）</text>
  <text class="f lb" x="226" y="176">12m</text>
  <rect x="380" y="380" width="300" height="58" fill="rgba(20,20,20,0.85)" stroke="#c8b45a" stroke-width="2"/>
  <text class="f lb" x="392" y="404">エレベーター: ハンガー&amp;居住区 ×2</text>
  <text class="f lb" x="392" y="428">35m</text>
  <line x1="455" y1="307" x2="500" y2="380" stroke="#c8b45a" stroke-width="1" stroke-dasharray="3 3"/>
  <!-- 現在位置の印 -->
  <circle cx="160" cy="430" r="9" fill="#00e5ff"/>
  <rect x="80" y="374" width="160" height="36" fill="rgba(20,20,20,0.85)" stroke="#00e5ff" stroke-width="2"/>
  <text class="f hl" x="90" y="398">現在位置 14:32:05</text>

  <!-- 右上のスイッチの欄 -->
  <rect x="650" y="10" width="240" height="336" fill="rgba(17,17,17,0.92)" stroke="#444"/>
  <g class="f sw">
    <use href="#on" x="660" y="34"/><text x="696" y="34">テクスチャ</text>
    <use href="#on" x="660" y="58"/><text x="696" y="58">色付け</text>
    <use href="#on" x="660" y="82"/><text x="696" y="82">現在位置</text>
  </g>
  <line x1="658" y1="96" x2="882" y2="96" stroke="#333"/>
  <text class="f hd" x="660" y="110">印</text>
  <g class="f sw">
    <use href="#on" x="660" y="132"/><text x="696" y="132">店</text>
    <use href="#on" x="660" y="154"/><text x="696" y="154">端末</text>
    <use href="#on" x="660" y="176"/><text x="696" y="176">エレベーター・トラム</text>
    <use href="#on" x="660" y="198"/><text x="696" y="198">クエストの扉・パネル</text>
    <use href="#on" x="660" y="220"/><text x="696" y="220">コメント</text>
  </g>
  <line x1="658" y1="232" x2="882" y2="232" stroke="#333"/>
  <text class="f hd" x="660" y="246">キャプション</text>
  <g class="f sw" opacity="0.4">
    <use href="#on" x="660" y="268"/><circle cx="701" cy="264" r="5" fill="#ffcc33"/><text x="712" y="268">着陸パッド (4)</text>
    <use href="#on" x="660" y="290"/><circle cx="701" cy="286" r="5" fill="#ff8ad8"/><text x="712" y="290">ドッキングポート (6)</text>
    <use href="#on" x="660" y="312"/><circle cx="701" cy="308" r="5" fill="#6fdc8c"/><text x="712" y="312">外部貨物エレベーター (1)</text>
    <use href="#on" x="660" y="334"/><circle cx="701" cy="330" r="5" fill="#6cb6ff"/><text x="712" y="334">ハンガー (14)</text>
  </g>

  <text class="f cap" x="16" y="548">中で見ているとき（仮の図。数・名前・距離・時刻は例です。実際の画面と細部が違うことがあります）</text>

  <!-- 番号 -->
  <g class="f">
    <circle cx="630" cy="30" r="13" fill="#ff5a36" stroke="#fff" stroke-width="2"/><text class="no" x="630" y="35" text-anchor="middle">1</text>
    <circle cx="630" cy="56" r="13" fill="#ff5a36" stroke="#fff" stroke-width="2"/><text class="no" x="630" y="61" text-anchor="middle">2</text>
    <circle cx="630" cy="82" r="13" fill="#ff5a36" stroke="#fff" stroke-width="2"/><text class="no" x="630" y="87" text-anchor="middle">3</text>
    <circle cx="630" cy="176" r="13" fill="#ff5a36" stroke="#fff" stroke-width="2"/><text class="no" x="630" y="181" text-anchor="middle">4</text>
    <circle cx="630" cy="300" r="13" fill="#ff5a36" stroke="#fff" stroke-width="2"/><text class="no" x="630" y="305" text-anchor="middle">5</text>
    <circle cx="200" cy="128" r="13" fill="#ff5a36" stroke="#fff" stroke-width="2"/><text class="no" x="200" y="133" text-anchor="middle">6</text>
    <circle cx="66" cy="392" r="13" fill="#ff5a36" stroke="#fff" stroke-width="2"/><text class="no" x="66" y="397" text-anchor="middle">7</text>
  </g>
</svg>
