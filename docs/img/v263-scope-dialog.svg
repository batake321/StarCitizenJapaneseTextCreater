<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 600" width="900" height="600" role="img" aria-labelledby="t d">
  <title id="t">日本語化の適応範囲のダイアログ（仮の図）</title>
  <desc id="d">翻訳タブの［日本語化］を押すと、先に「日本語化の適応範囲」のダイアログが出ます。全て翻訳か一部翻訳を選び、一部翻訳なら日本語にする種類にチェックを付けて［次へ］を押すと、今までの「日本語化」のダイアログ（名前に付ける印のチェック）に進み、［実行］で書き出します。</desc>
  <style>
    .f  { font-family: sans-serif; }
    .tt { font-size: 13px; fill: #1a1a1a; }
    .tx { font-size: 14px; fill: #1a1a1a; }
    .sm { font-size: 12.5px; fill: #1a1a1a; }
    .bt { font-size: 13px; fill: #1a1a1a; }
    .no { font-size: 15px; fill: #fff; font-weight: 700; }
    .cap { font-size: 12.5px; fill: #c9d6e3; }
  </style>
  <defs>
    <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#ff5a36"/>
    </marker>
    <g id="cbOn"><rect x="0" y="0" width="13" height="13" fill="#fff" stroke="#333"/><path d="M2.5 6.5 L5.5 9.5 L10.5 3" fill="none" stroke="#1a1a1a" stroke-width="1.8"/></g>
    <g id="cbOff"><rect x="0" y="0" width="13" height="13" fill="#fff" stroke="#333"/></g>
  </defs>

  <rect x="0" y="0" width="900" height="600" rx="8" fill="#1b222c"/>

  <!-- 1 枚目: 日本語化の適応範囲 -->
  <rect x="20" y="20" width="470" height="560" fill="#f3f3f3" stroke="#8a8a8a"/>
  <rect x="20" y="20" width="470" height="32" fill="#ffffff" stroke="#8a8a8a"/>
  <text class="f tt" x="34" y="41">日本語化の適応範囲</text>
  <text class="f tt" x="468" y="41">✕</text>

  <text class="f tx" x="40" y="82">ゲームの文のうち、日本語にする範囲を選んでください</text>

  <circle cx="47" cy="110" r="6.5" fill="#fff" stroke="#333"/>
  <text class="f sm" x="60" y="115">全て翻訳</text>
  <circle cx="47" cy="136" r="6.5" fill="#fff" stroke="#333"/><circle cx="47" cy="136" r="3.2" fill="#1a1a1a"/>
  <text class="f sm" x="60" y="141">一部翻訳</text>

  <text class="f sm" x="60" y="170">チェックを付けた種類を日本語にします（外した種類は英語のまま）</text>
  <g class="f sm">
    <use href="#cbOff" x="60" y="182"/><text x="80" y="194">品の名前</text>
    <use href="#cbOn"  x="60" y="206"/><text x="80" y="218">品の説明</text>
    <use href="#cbOn"  x="60" y="230"/><text x="80" y="242">コモディティの名前</text>
    <use href="#cbOn"  x="60" y="254"/><text x="80" y="266">コモディティの説明</text>
    <use href="#cbOn"  x="60" y="278"/><text x="80" y="290">船の説明</text>
    <use href="#cbOn"  x="60" y="302"/><text x="80" y="314">契約名</text>
    <use href="#cbOn"  x="60" y="326"/><text x="80" y="338">契約の説明</text>
    <use href="#cbOff" x="60" y="350"/><text x="80" y="362">地名</text>
    <use href="#cbOn"  x="60" y="374"/><text x="80" y="386">契約の中の場所・品</text>
    <use href="#cbOn"  x="60" y="398"/><text x="80" y="410">人名・肩書き</text>
    <use href="#cbOn"  x="60" y="422"/><text x="80" y="434">台詞・字幕</text>
    <use href="#cbOn"  x="60" y="446"/><text x="80" y="458">画面の文字</text>
    <use href="#cbOn"  x="60" y="470"/><text x="80" y="482">派閥名</text>
    <use href="#cbOn"  x="60" y="494"/><text x="80" y="506">その他</text>
  </g>

  <rect x="300" y="528" width="80" height="28" fill="#e5f1fb" stroke="#0078d4" stroke-width="1.5"/>
  <text class="f bt" x="340" y="547" text-anchor="middle">次へ</text>
  <rect x="390" y="528" width="84" height="28" fill="#fdfdfd" stroke="#adadad"/>
  <text class="f bt" x="432" y="547" text-anchor="middle">キャンセル</text>

  <!-- 2 枚目: 日本語化 (印) -->
  <rect x="530" y="20" width="350" height="330" fill="#f3f3f3" stroke="#8a8a8a"/>
  <rect x="530" y="20" width="350" height="32" fill="#ffffff" stroke="#8a8a8a"/>
  <text class="f tt" x="544" y="41">日本語化</text>
  <text class="f tt" x="858" y="41">✕</text>
  <text class="f tx" x="548" y="80">ゲーム内で名前に以下を付けたい時は</text>
  <text class="f tx" x="548" y="100">下のオプションにチェックを付けてください</text>
  <g class="f sm">
    <use href="#cbOn"  x="548" y="120"/><text x="568" y="132">装備名の後ろに分類を付ける</text>
    <text x="568" y="150">例：Bracer [軍1C]</text>
    <use href="#cbOff" x="548" y="166"/><text x="568" y="178">契約名に派閥と貢献度を付ける</text>
    <text x="568" y="196">例：トラッカーライセンス認定資格</text>
    <text x="568" y="214">[バウンティーハンターズ・ギルド +50]</text>
    <use href="#cbOn"  x="548" y="230"/><text x="568" y="242">契約名に設計図を付ける</text>
    <text x="568" y="260">例：Orison救援：小規模製造依頼 [BP]</text>
  </g>
  <rect x="690" y="300" width="80" height="28" fill="#e5f1fb" stroke="#0078d4" stroke-width="1.5"/>
  <text class="f bt" x="730" y="319" text-anchor="middle">実行</text>
  <rect x="780" y="300" width="84" height="28" fill="#fdfdfd" stroke="#adadad"/>
  <text class="f bt" x="822" y="319" text-anchor="middle">キャンセル</text>

  <!-- 次へ → 2 枚目 -->
  <path d="M340 557 C 340 590, 505 590, 505 480 C 505 420, 600 400, 640 356" fill="none" stroke="#ff5a36" stroke-width="2.5" marker-end="url(#ar)"/>

  <text class="f cap" x="530" y="492">［次へ］で、名前に付ける印を選ぶダイアログへ</text>
  <text class="f cap" x="530" y="512">（今までの「日本語化」のダイアログ）</text>
  <text class="f cap" x="530" y="545">図は、品の名前と地名を英語のままにする例です。</text>
  <text class="f cap" x="530" y="565">実際の画面と細部が違うことがあります（仮の図）。</text>

  <!-- 番号 -->
  <g class="f">
    <circle cx="150" cy="123" r="13" fill="#ff5a36" stroke="#fff" stroke-width="2"/><text class="no" x="150" y="128" text-anchor="middle">1</text>
    <circle cx="250" cy="200" r="13" fill="#ff5a36" stroke="#fff" stroke-width="2"/><text class="no" x="250" y="205" text-anchor="middle">2</text>
    <circle cx="340" cy="510" r="13" fill="#ff5a36" stroke="#fff" stroke-width="2"/><text class="no" x="340" y="515" text-anchor="middle">3</text>
    <circle cx="845" cy="140" r="13" fill="#ff5a36" stroke="#fff" stroke-width="2"/><text class="no" x="845" y="145" text-anchor="middle">4</text>
    <circle cx="730" cy="282" r="13" fill="#ff5a36" stroke="#fff" stroke-width="2"/><text class="no" x="730" y="287" text-anchor="middle">5</text>
  </g>
</svg>
