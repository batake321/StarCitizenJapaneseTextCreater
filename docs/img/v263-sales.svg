<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 560" width="900" height="560" role="img" aria-labelledby="t d">
  <title id="t">店の端末の販売品の枠（仮の図）</title>
  <desc id="d">店の端末を押すと出る販売品の枠。上に題と閉じる ✕、品名の一部で絞り込む欄、並び（元の順・品名・価格・種類）と昇順・降順のボタン、表示する種類のチェック（種類ごとの数と［全部］）があり、その下に店の名前、品の数、品名・種類・価格の表が出ます。</desc>
  <style>
    .f  { font-family: sans-serif; }
    .tx { font-size: 13px; fill: #ddd; }
    .b  { font-size: 14px; fill: #ddd; font-weight: 700; }
    .ph { font-size: 13px; fill: #777; }
    .bl { font-size: 13px; fill: #9cf; }
    .gy { font-size: 12px; fill: #aaa; }
    .no { font-size: 15px; fill: #fff; font-weight: 700; }
    .cap { font-size: 12.5px; fill: #c9d6e3; }
  </style>
  <defs>
    <g id="cbOn"><rect x="0" y="-11" width="12" height="12" rx="2" fill="#2d6cdf" stroke="#2d6cdf"/><path d="M2.5 -5 L5 -2.5 L9.5 -8" fill="none" stroke="#fff" stroke-width="1.8"/></g>
    <g id="cbOff"><rect x="0" y="-11" width="12" height="12" rx="2" fill="#222" stroke="#888"/></g>
  </defs>

  <rect x="0" y="0" width="900" height="560" fill="#111"/>
  <rect x="0" y="0" width="900" height="560" fill="#2b2a28" opacity="0.35"/>

  <!-- 枠 -->
  <rect x="130" y="20" width="640" height="420" fill="#1b1f24" stroke="#9ab" stroke-width="2"/>
  <rect x="140" y="28" width="620" height="118" fill="rgba(0,0,0,0.92)"/>
  <text class="f b" x="146" y="48">販売品: Food &amp; Drinks</text>
  <rect x="730" y="32" width="24" height="22" fill="#222" stroke="#666"/><text class="f tx" x="742" y="48" text-anchor="middle">✕</text>

  <rect x="146" y="62" width="370" height="24" fill="#222" stroke="#444"/>
  <text class="f ph" x="152" y="79">品名の一部で絞り込み</text>
  <text class="f tx" x="526" y="79">並び:</text>
  <rect x="562" y="64" width="80" height="22" fill="#222" stroke="#444"/><text class="f tx" x="568" y="80">価格</text><text class="f tx" x="630" y="80">▾</text>
  <rect x="650" y="64" width="72" height="22" fill="#222" stroke="#666"/><text class="f tx" x="686" y="80" text-anchor="middle">昇順 ▲</text>

  <text class="f bl" x="146" y="106">▼ 表示する種類 (2 / 3)・表示 7 / 8 品</text>
  <rect x="146" y="116" width="44" height="20" fill="#222" stroke="#666"/><text class="f tx" x="168" y="131" text-anchor="middle">全部</text>
  <g class="f tx">
    <use href="#cbOn" x="204" y="132"/><text x="221" y="131">食べ物 (4)</text>
    <use href="#cbOn" x="310" y="132"/><text x="327" y="131">ドリンク (3)</text>
    <use href="#cbOff" x="424" y="132"/><text x="441" y="131">その他 (1)</text>
  </g>

  <!-- 中身 -->
  <text class="f bl" x="146" y="172">Food &amp; Drinks</text>
  <text class="f gy" x="146" y="190">7 / 8 品</text>
  <g class="f tx">
    <rect x="146" y="198" width="430" height="24" fill="#2a3038" stroke="#445"/>
    <line x1="346" y1="198" x2="346" y2="390" stroke="#445"/><line x1="456" y1="198" x2="456" y2="390" stroke="#445"/>
    <text x="152" y="215">品名</text><text x="352" y="215">種類</text><text x="462" y="215">価格</text>
    <rect x="146" y="222" width="430" height="168" fill="none" stroke="#445"/>
    <line x1="146" y1="246" x2="576" y2="246" stroke="#445"/><line x1="146" y1="270" x2="576" y2="270" stroke="#445"/>
    <line x1="146" y1="294" x2="576" y2="294" stroke="#445"/><line x1="146" y1="318" x2="576" y2="318" stroke="#445"/>
    <line x1="146" y1="342" x2="576" y2="342" stroke="#445"/><line x1="146" y1="366" x2="576" y2="366" stroke="#445"/>
    <text x="152" y="239">Water</text><text x="352" y="239">ドリンク</text><text x="570" y="239" text-anchor="end">3 aUEC</text>
    <text x="152" y="263">Coffee</text><text x="352" y="263">ドリンク</text><text x="570" y="263" text-anchor="end">5 aUEC</text>
    <text x="152" y="287">Hot Dog</text><text x="352" y="287">食べ物</text><text x="570" y="287" text-anchor="end">8 aUEC</text>
    <text x="152" y="311">Smoothie</text><text x="352" y="311">ドリンク</text><text x="570" y="311" text-anchor="end">9 aUEC</text>
    <text x="152" y="335">Sandwich</text><text x="352" y="335">食べ物</text><text x="570" y="335" text-anchor="end">11 aUEC</text>
    <text x="152" y="359">Noodles</text><text x="352" y="359">食べ物</text><text x="570" y="359" text-anchor="end">14 aUEC</text>
    <text x="152" y="383">Burrito</text><text x="352" y="383">食べ物</text><text x="570" y="383" text-anchor="end">16 aUEC</text>
  </g>
  <text class="f gy" x="146" y="420">枠の上でホイールを回すと中がスクロールします（上の見出しと ✕ は残ります）</text>

  <text class="f cap" x="16" y="548">仮の図。店名・品名・値段は説明のための例です。実際の画面と細部が違うことがあります</text>

  <!-- 番号 -->
  <g class="f">
    <circle cx="500" cy="62" r="13" fill="#ff5a36" stroke="#fff" stroke-width="2"/><text class="no" x="500" y="67" text-anchor="middle">1</text>
    <circle cx="602" cy="104" r="13" fill="#ff5a36" stroke="#fff" stroke-width="2"/><text class="no" x="602" y="109" text-anchor="middle">2</text>
    <circle cx="700" cy="104" r="13" fill="#ff5a36" stroke="#fff" stroke-width="2"/><text class="no" x="700" y="109" text-anchor="middle">3</text>
    <circle cx="400" cy="100" r="13" fill="#ff5a36" stroke="#fff" stroke-width="2"/><text class="no" x="400" y="105" text-anchor="middle">4</text>
    <circle cx="132" cy="126" r="13" fill="#ff5a36" stroke="#fff" stroke-width="2"/><text class="no" x="132" y="131" text-anchor="middle">5</text>
    <circle cx="214" cy="186" r="13" fill="#ff5a36" stroke="#fff" stroke-width="2"/><text class="no" x="214" y="191" text-anchor="middle">6</text>
    <circle cx="772" cy="43" r="13" fill="#ff5a36" stroke="#fff" stroke-width="2"/><text class="no" x="772" y="48" text-anchor="middle">7</text>
  </g>
</svg>
